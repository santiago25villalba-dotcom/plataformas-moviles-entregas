<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <div class="container my-4 my-md-5">
        <h1 class="mb-4">Editor de Texto</h1>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <h2>Texto</h2>
                <p class="texto fs-6" id="texto">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>
                
                <hr class="hr">

               
                <div class="mb-3">
                    <label for="input-texto" class="form-label fw-bold">Editar contenido:</label>
                    <input type="text" id="input-texto" class="form-control" value="Lorem ipsum dolor sit amet, consectetur adipiscing elit...">
                </div>

                
                <div class="mb-3">
                    <label for="range-tamano" class="form-label fw-bold">Tamaño de letra: <span id="valor-tamano">1rem</span></label>
                    <input type="range" class="form-range" id="range-tamano" min="0.8" max="2.5" step="0.1" value="1">
                </div>

                <h2>Opciones de Formato</h2>
                <div class="row g-2">
                    <div class="col-6 col-md-3">
                        <button id="btn-negrita" class="btn d-block w-100 btn-outline-primary" data-formato="negrita">
                            Bold (Negrita)
                        </button>
                    </div>
                    <div class="col-6 col-md-3">
                        <button id="btn-cursiva" class="btn d-block w-100 btn-outline-primary" data-formato="cursiva">
                            Italic (Cursiva)
                        </button>
                    </div>
                    <div class="col-6 col-md-3">
                        <button id="btn-subrayado" class="btn d-block w-100 btn-outline-primary" data-formato="subrayado">
                            Underline (Subrayado)
                        </button>
                    </div>
                  
                    <div class="col-6 col-md-3">
                        <button id="btn-color" class="btn d-block w-100 btn-outline-danger" data-formato="color">
                            Color Rojo
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    
    <script type="text/javascript">
        const texto = document.getElementById('texto');
        const inputTexto = document.getElementById('input-texto');
        const rangeTamano = document.getElementById('range-tamano');
        const spanTamano = document.getElementById('valor-tamano');

       
        inputTexto.addEventListener('input', (e) => {
            texto.textContent = e.target.value;
        });

       
        rangeTamano.addEventListener('input', (e) => {
            const nuevoTamano = e.target.value + 'rem';
            texto.style.fontSize = nuevoTamano;
            spanTamano.textContent = nuevoTamano;
        });

        function funcionNegrita() {
            const activo = texto.classList.toggle('fw-bold');
            actualizarEstadoBotón('btn-negrita', activo);
        }

        function funcionCursiva() {
            const activo = texto.classList.toggle('fst-italic');
            actualizarEstadoBotón('btn-cursiva', activo);
        }

        function funcionSubrayado() {
            const activo = texto.classList.toggle('text-decoration-underline');
            actualizarEstadoBotón('btn-subrayado', activo);
        }

       
        function funcionColor() {
            const activo = texto.classList.toggle('text-danger');
            const boton = document.getElementById('btn-color');
            
          
            if (activo) {
                boton.classList.remove('btn-outline-danger');
                boton.classList.add('btn-danger');
            } else {
                boton.classList.remove('btn-danger');
                boton.classList.add('btn-outline-danger');
            }
        }

        
        function actualizarEstadoBotón(idBoton, activo) {
            const boton = document.getElementById(idBoton);
            if (activo) {
                boton.classList.remove('btn-outline-primary');
                boton.classList.add('btn-primary');
            } else {
                boton.classList.remove('btn-primary');
                boton.classList.add('btn-outline-primary');
            }
        }

        function handlerBoton(e) {
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    funcionColor();
                    break;
            }
        }

        document.querySelectorAll('button.btn').forEach(e => e.addEventListener('click', handlerBoton));
    </script>
</body>
</html>
